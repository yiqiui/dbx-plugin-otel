name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    # Reuse the official DBX packaging workflow. The reusable workflow ref must
    # be a ref that actually exists in t8y2/dbx: there is no `plugin-sdk-v1`
    # tag (only plugin-cli-v* and release v0.6.x tags), so pin to the branch
    # the official plugin examples use.
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@main
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.9
      # Go cross-compiles with CGO disabled, so every target builds on its own
      # runner without needing any local toolchain for that platform.
      build-matrix: '{"include":[{"runner":"windows-2022","target":"windows-x64"},{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"macos-15","target":"darwin-arm64"},{"runner":"macos-15-intel","target":"darwin-x64"}]}'
